<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Report Maker | Arya x Etho AI</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2652/2652218.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #64748b;
            --accent: #a855f7;
            --danger: #ef4444;
            --bg: #f8fafc;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 10px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .brand-header h1 {
            margin: 0;
            font-size: 1.6rem;
            color: #1e293b;
            font-weight: 800;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
            display: block;
        }

        /* Responsive Form Grid */
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.75rem; font-weight: 700; margin-bottom: 0.4rem; color: #475569; }
        
        input {
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline-color: var(--primary);
        }

        /* Buttons Grid */
        .actions { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem; 
            margin-bottom: 2rem; 
        }

        button {
            cursor: pointer;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            color: white;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.98); }

        .btn-add { background: var(--primary); grid-column: span 2; font-size: 1.1rem; }
        .btn-json-dl { background: var(--secondary); }
        .btn-json-ul { background: var(--accent); }
        .btn-pdf { background: #0f172a; grid-column: span 2; }
        
        #fileInput { display: none; }

        /* Data Display */
        .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; }
        th { background: #f8fafc; color: #64748b; white-space: nowrap; }

        .total-banner {
            font-size: 1.4rem;
            font-weight: 800;
            text-align: right;
            padding: 1rem;
            background: #f8fafc;
            border-radius: 12px;
            margin-top: 1rem;
        }

        .delete-btn { background: #fee2e2; color: var(--danger); border-radius: 4px; padding: 4px 8px; font-size: 0.7rem; }

        @media (max-width: 640px) {
            .brand-header h1 { font-size: 1.3rem; }
            .container { padding: 1rem; }
            td { min-width: 100px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="brand-header">
        <h1>Expense Report Maker</h1>
        <span class="brand-subtitle">by Arya x Etho AI</span>
    </header>

    <div class="input-grid">
        <div class="input-group">
            <label>Transaction Date</label>
            <input type="date" id="date">
        </div>
        <div class="input-group">
            <label>Paid By (Name)</label>
            <input type="text" id="name" placeholder="Enter name">
        </div>
        <div class="input-group">
            <label>Amount (₹)</label>
            <input type="number" id="amount" placeholder="0.00" step="0.01">
        </div>
        <div class="input-group">
            <label>Purpose</label>
            <input type="text" id="purpose" placeholder="What was it for?">
        </div>
    </div>

    <div class="actions">
        <button class="btn-add" onclick="addExpense()">+ Add Expense</button>
        <button class="btn-json-dl" onclick="downloadJSON()">💾 Export JSON</button>
        <button class="btn-json-ul" onclick="document.getElementById('fileInput').click()">📂 Import JSON</button>
        <button class="btn-pdf" onclick="generatePDF()">📄 Download PDF Report</button>
        <input type="file" id="fileInput" accept=".json" onchange="uploadJSON(event)">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Name</th>
                    <th>Amount</th>
                    <th>Purpose</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="expenseBody"></tbody>
        </table>
    </div>

    <div class="total-banner">
        Total: ₹<span id="totalAmount">0.00</span>
    </div>
</div>

<script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
        });
    }

    let expenses = [];
    document.getElementById('date').valueAsDate = new Date();

    // Human-readable date formatting (Day Month Year)
    function formatDateLong(dateStr) {
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-GB', {
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        });
    }

    function addExpense() {
        const date = document.getElementById('date').value;
        const name = document.getElementById('name').value;
        const amount = parseFloat(document.getElementById('amount').value);
        const purpose = document.getElementById('purpose').value;

        if (!date || !name || isNaN(amount) || !purpose) {
            alert("Please fill in all details.");
            return;
        }

        expenses.push({ id: Date.now(), date, name, amount, purpose });
        updateUI();
        
        // Reset inputs
        document.getElementById('name').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('purpose').value = '';
    }

    function deleteExpense(id) {
        expenses = expenses.filter(e => e.id !== id);
        updateUI();
    }

    function updateUI() {
        const tbody = document.getElementById('expenseBody');
        const totalEl = document.getElementById('totalAmount');
        tbody.innerHTML = '';
        
        let total = 0;
        expenses.sort((a,b) => new Date(b.date) - new Date(a.date)); // Newest first

        expenses.forEach(exp => {
            total += exp.amount;
            tbody.innerHTML += `
                <tr>
                    <td>${formatDateLong(exp.date)}</td>
                    <td><b>${exp.name}</b></td>
                    <td>₹${exp.amount.toFixed(2)}</td>
                    <td>${exp.purpose}</td>
                    <td><button class="delete-btn" onclick="deleteExpense(${exp.id})">Delete</button></td>
                </tr>
            `;
        });
        totalEl.innerText = total.toLocaleString('en-IN', {minimumFractionDigits: 2});
    }

    function downloadJSON() {
        if (expenses.length === 0) return alert("No data to export.");
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(expenses));
        const dl = document.createElement('a');
        dl.setAttribute("href", dataStr);
        dl.setAttribute("download", `Expenses_${new Date().toISOString().slice(0,10)}.json`);
        dl.click();
    }

    function uploadJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                expenses = JSON.parse(e.target.result);
                updateUI();
            } catch { alert("Invalid JSON file"); }
        };
        reader.readAsText(file);
    }

    function generatePDF() {
        if (expenses.length === 0) return alert("Add expenses first.");
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        // Header
        doc.setFontSize(22);
        doc.setTextColor(99, 102, 241);
        doc.text("Expense Report", 14, 20);
        
        doc.setFontSize(10);
        doc.setTextColor(100, 116, 139);
        doc.text("Generated by Arya x Etho AI", 14, 26);
        
        const tableData = expenses.map(exp => [
            formatDateLong(exp.date),
            exp.name,
            `Rs. ${exp.amount.toFixed(2)}`,
            exp.purpose
        ]);

        doc.autoTable({
            startY: 32,
            head: [['Date', 'Paid By', 'Amount', 'Purpose']],
            body: tableData,
            foot: [['', 'TOTAL', `Rs. ${expenses.reduce((s, e) => s + e.amount, 0).toFixed(2)}`, '']],
            headStyles: { fillColor: [99, 102, 241] },
            theme: 'striped'
        });

        doc.save(`Expense_Report_${Date.now()}.pdf`);
    }
</script>

</body>
</html>
